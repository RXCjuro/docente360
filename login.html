
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ingresar · Docente360</title>

    <!-- Icono -->
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    >

    <!-- Estilos CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login">

    <!-- Encabezado -->
    <header class="lg-cab">

        <a class="lg-logo" href="login.html" aria-label="Docente360">
            <img src="assets/icons/logo.svg" alt="" width="32" height="32">
            <span>Docente360</span>
        </a>

        <p class="lg-zona">Acceso administrativo</p>

    </header>

    <!-- Contenido principal -->
    <main class="lg-main">

        <!-- Imagen del campus -->
        <figure class="lg-foto">
            <img
                src="assets/img/campus.jpg"
                alt="Sede de CERTUS, edificio de once pisos con balcones de colores"
                width="588"
                height="510"
            >
        </figure>

        <!-- Panel de inicio de sesión -->
        <section class="lg-panel" aria-labelledby="lg-titulo">

            <span class="lg-regla" aria-hidden="true"></span>

            <h1 id="lg-titulo">Docente360</h1>
            <p class="lg-sub">Gestión de docentes Certus</p>

            <form id="form" class="lg-card" novalidate>

                <h2>Iniciar sesión</h2>

                <!-- Correo -->
                <label for="correo">Correo</label>

                <input
                    id="correo"
                    name="correo"
                    type="email"
                    inputmode="email"
                    autocomplete="username"
                    placeholder="usuario@certus.edu.pe"
                    required
                    autofocus
                >

                <!-- Contraseña -->
                <label for="clave">Contraseña</label>

                <div class="lg-clave">

                    <input
                        id="clave"
                        name="clave"
                        type="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >

                    <button
                        type="button"
                        id="ver"
                        class="lg-ojo"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false"
                    >
                        Mostrar
                    </button>

                </div>

                <!-- Mensajes de error -->
                <p
                    id="error"
                    class="lg-error"
                    role="alert"
                    aria-live="assertive"
                ></p>

                <!-- Botón de ingreso -->
                <button id="entrar" class="lg-btn" type="submit">
                    Ingresar
                </button>

                <!-- Nota informativa -->
                <p class="lg-nota">
                    Acceso exclusivo para personal autorizado
                </p>

            </form>

        </section>

    </main>

    <!-- Pie de página -->
    <footer class="lg-pie">

        <img src="assets/icons/logo.svg" alt="" width="24" height="24">

        <p>
            © <span id="anio">2026</span> Docente360 · Portal de gestión docente
        </p>

    </footer>

    <!-- Autenticación JavaScript -->

<script type="module">
    import {
        loginCorreo,
        observarSesion
    } from "./js/services/auth-service.js";

    const $ = (id) => document.getElementById(id);

    const form = $("form");
    const err = $("error");
    const btn = $("entrar");

    // Año actual
    $("anio").textContent = new Date().getFullYear();

    // Verificar sesión activa
    observarSesion((u) => {
        if (u) location.href = "dashboard.html";
    });

    // Mostrar u ocultar contraseña
    $("ver").onclick = (e) => {
        const oculto = $("clave").type === "password";

        $("clave").type = oculto ? "text" : "password";
        e.currentTarget.textContent = oculto ? "Ocultar" : "Mostrar";

        e.currentTarget.setAttribute(
            "aria-pressed",
            String(oculto)
        );

        e.currentTarget.setAttribute(
            "aria-label",
            oculto ? "Ocultar contraseña" : "Mostrar contraseña"
        );
    };

    // Controlar el botón durante el ingreso
    function ocupado(si, boton, texto) {
        btn.disabled = si;

        if (boton) boton.dataset.txt ??= boton.textContent.trim();

        if (boton) {
            boton.textContent = si ? texto : boton.dataset.txt;
        }

        form.setAttribute("aria-busy", String(si));
    }

    // Función de autenticación
    async function entrar(accion, boton, texto) {
        err.textContent = "";
        ocupado(true, boton, texto);

        try {
            await accion();
            location.href = "dashboard.html";

        } catch (e) {
            err.textContent = e.message;
            ocupado(false, boton);
        }
    }

    // Inicio de sesión con correo y contraseña
    form.addEventListener("submit", (e) => {
        e.preventDefault();

        const correo = $("correo").value.trim();
        const clave = $("clave").value;

        if (!correo || !clave) {
            err.textContent = "Escribe tu correo y tu contraseña.";
            (correo ? $("clave") : $("correo")).focus();
            return;
        }

        entrar(
            () => loginCorreo(correo, clave),
            btn,
            "Ingresando…"
        );
    });
</script>


</body>
</html>
